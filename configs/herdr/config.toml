onboarding = false

[terminal]
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[theme]
name = "tokyo-night"
auto_switch = false

[keys]
prefix = "ctrl+semicolon"
previous_workspace = "prefix+up"
next_workspace = "prefix+down"

[session]
resume_agents_on_restore = true

[ui]
confirm_close = true
mouse_capture = true
pane_gaps = false
right_click_passthrough_modifier = "ctrl"
mouse_scroll_lines = 3
prompt_new_tab_name = true
agent_panel_scope = "all"
accent = "#c6a0f6"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "top-right"

[update]
channel = "stable"
version_check = true
manifest_check = true

[experimental]
switch_ascii_input_source_in_prefix = true
