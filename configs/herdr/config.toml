[terminal]
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[theme]
name = "catppuccin"

[theme.custom]
# Catppuccin Macchiato-inspired overrides.
panel_bg = "#24273a"
accent = "#c6a0f6"
blue = "#8aadf4"
green = "#a6da95"
red = "#ed8796"
yellow = "#eed49f"

[keys]
# Global prefix changed from default ctrl+b to avoid clobbering
# common shell/readline and tmux bindings.
# prefix = "ctrl+;"

[session]
resume_agents_on_restore = true

[ui]
sidebar_width = 26
mouse_capture = true

[update]
channel = "stable"
version_check = true
manifest_check = true
