[packages]
brew = [ 'ghostty', 'nvim', 'eza', 'gitmux', 'starship' ]
app = [ 'Rectangle', 'Zed' ]

[configs.app]
'RectangleProConfig.json' = '~/Library/Application Support/Rectangle Pro/RectangleProConfig.json'

[configs.symlink]
'.agents' = '~/.agents'
'.pi' = '~/.pi'
# Per-entry, never the whole '~/.claude' directory: dotfiler RemoveAll's a target
# that already exists as a real path, which would delete projects/, history and plugins.
'.claude/CLAUDE.md' = '~/.claude/CLAUDE.md'
'.claude/settings.json' = '~/.claude/settings.json'
'.claude/hooks' = '~/.claude/hooks'
'.claude/themes' = '~/.claude/themes'
'.claude/commands' = '~/.claude/commands'
'.agents/skills' = '~/.claude/skills'
'.tmux.conf' = '~/.tmux.conf'
'.zshutils' = '~/.zshutils'
'ghostty' = '~/.config/ghostty'
'wezterm' = '~/.config/wezterm'
'lazygit' = '~/.config/lazygit'
'herdr/config.toml' = '~/.config/herdr/config.toml'
'mise' = '~/.config/mise'
'nvim' = '~/.config/nvim'
'rex' = '~/.config/rex'
'zed' = '~/.config/zed'
'starship.toml' = '~/.config/starship.toml'

[[commands]]
name = 'Register Herdr default tabs plugin'
command = [ 'herdr', 'plugin', 'link', 'configs/herdr/plugins/default-tabs' ]
